apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
  namespace: todo
spec:
  replicas: 2

  selector:
    matchLabels:
      app: todo-frontend

  template:
    metadata:
      labels:
        app: todo-frontend

    spec:
      containers:
        - name: todo-frontend
          image: ramakrishnapanda2001/todo-frontend:1.1

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: todo-frontend
  namespace: todo
spec:
  type: NodePort

  selector:
    app: todo-frontend

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
